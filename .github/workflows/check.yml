name: Lightweight checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -c "from app import build_app; build_app()"
# CI does not download or evaluate voice models. See VALIDATION.md.
